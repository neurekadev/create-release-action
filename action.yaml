name: Create Release Action
description: Create a GitHub Release with provider-neutral AI-generated release notes.
author: Neureka.Dev

branding:
  icon: package
  color: purple

inputs:
  github-token:
    description: GitHub token with contents write permission.
    required: true
  api-format:
    description: Model API format; openai for Chat Completions or anthropic for Messages.
    required: false
    default: openai
  api-key:
    description: Optional model endpoint credential, sent as a bearer token for openai or x-api-key for anthropic.
    required: false
  base-url:
    description: Base URL or full endpoint URL; defaults to https://api.openai.com/v1 for openai or https://api.anthropic.com/v1 for anthropic.
    required: false
  model:
    description: Model used to generate release notes; defaults to gpt-5.6-luna for openai or claude-opus-5-5 for anthropic.
    required: false
  reasoning-effort:
    description: Reasoning effort, or none to omit the provider parameter.
    required: false
    default: xhigh
  release-tag:
    description: Existing bare Semantic Version release tag to regenerate during workflow_dispatch.
    required: false
  release-notes-audience:
    description: Release-note audience and detail level; end-user, technical, or maintainer.
    required: false
    default: end-user
  request-options:
    description: JSON object merged into the model request body.
    required: false
    default: "{}"
  max-chunk:
    description: Maximum comparison characters sent in each analysis request.
    required: false
    default: "200000"
  timeout:
    description: Timeout in seconds for each model request.
    required: false
    default: "300"
  files:
    description: Newline-separated asset paths or glob patterns used only when creating a release.
    required: false
  upstream-repository:
    description: Upstream owner/repository for soft-fork revision releases, or auto.
    required: false
    default: auto
  upstream-tag:
    description: Upstream release tag for soft-fork revision releases, or auto.
    required: false
    default: auto

outputs:
  release-id:
    description: Numeric GitHub Release identifier.
  release-url:
    description: Published GitHub Release URL.
  release-notes:
    description: Generated Markdown release notes.
  baseline-tag:
    description: Published reachable release tag used as the comparison baseline.

runs:
  using: node24
  main: dist/index.js
