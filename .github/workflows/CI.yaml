name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: actionlint .github/workflows/CI.yaml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Action
        run: npm run build
      - name: Verify Bundled Distribution
        run: git diff --exit-code -- dist

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - lint
      - unit-tests
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check Out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create Release
        id: create-release
        uses: ./
        with:
          github-token: ${{ github.token }}
          api-key: ${{ secrets.INFERENCE_API_KEY }}
      - name: Update Compatibility Tags
        if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          major="${RELEASE_TAG%%.*}"
          remainder="${RELEASE_TAG#*.}"
          minor="${major}.${remainder%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$minor" "$RELEASE_TAG"
          git tag --force "$major" "$RELEASE_TAG"
          git push origin --force "refs/tags/$minor" "refs/tags/$major"
