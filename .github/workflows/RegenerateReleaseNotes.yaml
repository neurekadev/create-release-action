name: Regenerate Release Notes

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing bare Semantic Version release tag. Leave empty when regenerating all releases.
        required: false
        type: string
      regenerate-all:
        description: "Regenerate all: I confirm overwriting the notes of every published release."
        required: false
        default: false
        type: boolean
      release-notes-audience:
        description: Audience for the regenerated notes.
        required: false
        default: end-user
        type: choice
        options:
          - end-user
          - technical
          - maintainer

permissions: {}

jobs:
  regenerate-release-notes:
    name: Regenerate Release Notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.regenerate-all && 360 || 20 }}
    permissions:
      contents: write
    steps:
      - name: Check Out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate Release Notes
        uses: ./
        with:
          github-token: ${{ github.token }}
          api-format: anthropic
          api-key: ${{ secrets.MODEL_API_KEY }}
          base-url: https://agents.neureka.dev
          model: claude-opus-5-5
          reasoning-effort: high
          release-tag: ${{ inputs.release-tag }}
          regenerate-all: ${{ inputs.regenerate-all }}
          release-notes-audience: ${{ inputs.release-notes-audience }}
